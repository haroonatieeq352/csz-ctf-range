{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Your Orders</h2>
  <table>
    <tr><th>ID</th><th>Item</th><th>Amount</th></tr>
    {% for r in rows %}
    <tr><td><a href="/orders/{{ r['id'] }}">{{ r['id'] }}</a></td><td>{{ r['item'] }}</td><td>{{ r['amount'] }}</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
