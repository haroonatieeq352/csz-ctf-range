<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}INSERT SQLi to Stored XSS Chain — Scenario 16{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    // Global XSS Detection Hook: Loaded in HEAD
    window.__XSS_TRIGGERED = false;
    const _origAlert = window.alert;
    window.alert = function(msg) {
      const isCszone = msg !== undefined && msg !== null && String(msg).toLowerCase().trim() === "cszone";
      if (isCszone) {
        window.__XSS_TRIGGERED = true;
        const reveal = () => {
          const box = document.getElementById("vault-box");
          const statusBadge = document.getElementById("lab-status");
          const target = document.getElementById("extracted-vault");
          if (statusBadge) {
            statusBadge.textContent = "SOLVED 🎉";
            statusBadge.className = "lab-status solved";
          }
          if (box && target) {
            fetch("/api/flag")
              .then(res => res.json())
              .then(data => {
                if (data && data.flag) {
                  target.innerText = data.flag;
                  box.style.display = "block";
                }
              })
              .catch(() => {});
          }
        };
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", reveal);
        } else {
          reveal();
        }
        setTimeout(reveal, 100);
      }
      return _origAlert(msg);
    };
  </script>
</head>
<body>
  <!-- PortSwigger Web Security Academy Style Lab Bar -->
  <div class="academy-header-strip">
    <div class="lab-pill-group">
      <div class="lab-pill-icon">🧪</div>
      <div class="lab-pill-type">LAB</div>
    </div>
    <div class="lab-info-block">
      <div class="difficulty-tag">EXPERT</div>
      <h1 class="lab-title-text">Chained Exploit: <code>INSERT SQL Injection</code> to <code>Second-Order Stored XSS</code></h1>
    </div>
    <div class="lab-status-wrapper">
      <span id="lab-status" class="lab-status unsolved">UNSOLVED</span>
    </div>
  </div>

  <header>
    <a href="/tickets" class="brand-wrapper">
      <div class="brand-title">🛡️ CSZone <span>SecOps Portal</span></div>
      <span class="badge-tag">Scenario 16 &bull; Port 8016</span>
    </a>
    <nav>
      <a href="/tickets" {% if request.path == '/' or request.path.startswith('/tickets') %}class="active"{% endif %}>🎫 Submit Ticket</a>
      <a href="/admin/compliance" {% if request.path.startswith('/admin') %}class="active"{% endif %}>🛡️ Admin Compliance Queue</a>
      <a href="/reset" class="nav-reset-btn" title="Reset all tickets to clean default state">🔄 Reset Lab</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    CSZone Enterprise Threat Operations &copy; 2026 &mdash; Scenario 16 (Port 8016)
  </footer>
</body>
</html>
