{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Account Login</h2>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <p style="color: var(--muted); font-size: 0.88rem;">Demo credentials: <code>participant</code> / <code>Range2024!</code></p>
  <form method="POST">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" value="participant" required autofocus>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" value="Range2024!" required>
    </div>
    <button type="submit">Sign In</button>
  </form>
</div>
{% endblock %}
