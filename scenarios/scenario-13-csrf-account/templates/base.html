<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CSZone — Scenario 13{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <a href="/" class="brand-wrapper">
    <div class="brand-title">CS<span>Zone</span></div>
    <span class="badge-tag">Scenario 13 &bull; Port 8013</span>
  </a>
  <nav>
    {% if session.get('user_id') %}
      <a href="/account" class="active">Account ({{ session.get('username') }})</a>
      <a href="/logout" style="color: var(--crimson);">Logout</a>
    {% else %}
      <a href="/login" {% if request.path == '/login' %}class="active"{% endif %}>Login</a>
      <a href="/register" class="btn" style="padding: 5px 14px; font-size: 0.82rem; margin-left: 8px;">Register</a>
    {% endif %}
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  CSZone Offensive Security Training Range &copy; 2026 &mdash; Scenario 13 (Port 8013)
</footer>
</body>
</html>
