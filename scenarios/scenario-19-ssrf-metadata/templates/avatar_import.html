{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Import Avatar From Remote URL</h2>
  <p style="color: var(--muted); font-size: 0.88rem;">
    The server fetches the image URL you provide and displays a preview snippet.
  </p>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="POST">
    <div class="form-group">
      <label>Image Resource URL</label>
      <input type="text" name="url" placeholder="http://example.com/avatar.png or http://127.0.0.1:8014/internal/metadata" required autofocus>
    </div>
    <button type="submit">Fetch Remote Resource</button>
  </form>
  {% if result %}
  <div style="margin-top: 24px;">
    <h3 style="color: var(--amber); font-size: 1rem; margin-bottom: 8px;">Fetched Content Response:</h3>
    <pre><code>{{ result }}</code></pre>
  </div>
  {% endif %}
</div>
{% endblock %}
