# ==============================================================================
# CSZone Cyber Range — Host Nginx Configuration Template
# For Shared Production VPS (Zero Conflict with other websites on the server)
#
# INSTRUCTIONS FOR DEVOPS TEAM:
# 1. Copy this file to: /etc/nginx/sites-available/offensivegrid.conf
# 2. Enable site: ln -s /etc/nginx/sites-available/offensivegrid.conf /etc/nginx/sites-enabled/
# 3. Test config: nginx -t
# 4. Reload Nginx: systemctl reload nginx
# 5. (Optional) Run Certbot for HTTPS: certbot --nginx -d hub.offensivegrid.com -d s01.offensivegrid.com ...
# ==============================================================================

# Rate limiting zone for burst DDoS protection at reverse-proxy level (HTTP 429 standard)
limit_req_zone $binary_remote_addr zone=csz_ctf_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=csz_brute_limit:10m rate=200r/m;
limit_req_status 429;

# ── Central Operations Hub ───────────────────────────────────────────────────
server {
    listen 80;
    server_name hub.offensivegrid.com hub.offensgrid.com;

    location / {
        limit_req zone=csz_ctf_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

