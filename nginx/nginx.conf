user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 128;

    # Gzip compression for high-speed client delivery
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting zone for burst DDoS protection at reverse-proxy level (HTTP 429 standard)
    limit_req_zone $binary_remote_addr zone=ctf_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=brute_limit:10m rate=200r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Common Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ── Central Operations Hub ─────────────────────────────────────────────
    server {
        listen 80;
        server_name hub.offensivegrid.com hub.offensgrid.com;

        location / {
            limit_req zone=ctf_limit burst=20 nodelay;
            limit_conn addr 50;
            proxy_pass http://central-hub:8000;
        }
    }

    # ── Scenario 01: Recon & Headers ──────────────────────────────────────
    server {
        listen 80;
        server_name s01.offensivegrid.com s01.offensgrid.com;
